<!DOCTYPE html>
<!-- ============================================================
     LOGIN SISWA v3 — dengan FITUR REKOMENDASI NAMA (autocomplete)
     Alur mengikuti aplikasi (2 langkah, TIDAK mengubah backend):
       1. Siswa mengetik 1-3 huruf awal nama -> muncul rekomendasi
          (diambil dari route GET /auth/student/search?name=...)
       2. Siswa mengklik namanya -> pindah ke halaman PIN
          (GET /student/verify?student_id=...), lalu isi PIN di sana.
     ============================================================ -->
<html lang="id">
<head>
  <meta charset="UTF-8">  <!-- mendukung huruf Indonesia -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- responsif di HP -->
  <title>Login Siswa — INFORMATIKA WORLD</title>  <!-- judul tab browser -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>  <!-- Tailwind CSS via CDN -->

  <style>
  /* ================= EFEK GLOW & ANIMASI (aksen hijau siswa) ================= */
  .glow-card { transition: all .3s ease; border: 1px solid rgba(255,255,255,.08); }  /* kartu dasar */
  .glow-card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(52,211,153,.6); box-shadow: 0 0 28px rgba(52,211,153,.35), inset 0 0 22px rgba(52,211,153,.07); }  /* naik + glow hijau */
  .glow-card:active { transform: scale(.97); }  /* mengecil sesaat saat diklik */
  .glow-card .ikon-bulat { transition: all .3s ease; }  /* lingkaran ikon ikut beranimasi */
  .glow-card:hover .ikon-bulat { box-shadow: 0 0 18px rgba(52,211,153,.55); transform: rotate(-6deg); }  /* ikon bersinar */
  .input-glow { transition: all .25s ease; }  /* kotak isian halus */
  .input-glow:focus { border-color: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.25), 0 0 14px rgba(52,211,153,.30); outline: none; }  /* cincin cahaya saat fokus */
  .saran-item { transition: all .15s ease; }  /* satu baris rekomendasi nama */
  .saran-item:hover, .saran-item.aktif { background: rgba(52,211,153,.12); color: #34d399; padding-left: 1.1rem; }  /* hover hijau + geser sedikit */
  </style>
</head>

<body class="bg-slate-950 text-slate-200 antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <!-- dekorasi latar: bola cahaya hijau blur -->
  <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-emerald-500/15 rounded-full blur-3xl"></div>

  <main class="w-full max-w-sm relative">
    <!-- tombol kembali ke halaman pilihan -->
    <a href="/login" class="inline-flex items-center gap-2 text-slate-400 hover:text-emerald-400 text-sm mb-6 transition">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Kembali ke pilihan login
    </a>

    <!-- kartu cari nama -->
    <div class="glow-card bg-slate-900/80 backdrop-blur rounded-2xl p-7">
      <div class="text-center mb-6">
        <div class="ikon-bulat mx-auto w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-400/30 flex items-center justify-center mb-3">
          <!-- ikon kaca pembesar (mencari nama) -->
          <svg class="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
          </svg>
        </div>
        <h1 class="text-xl font-bold text-white">Login Siswa</h1>
        <p class="text-slate-400 text-xs mt-1">Ketik 1–3 huruf awal namamu, lalu pilih namamu</p>
      </div>

      <!-- CATATAN: sengaja TIDAK memakai <form>, karena alurnya pilih nama dulu
           (bukan kirim data). Kalau pakai form, menekan Enter malah me-reload halaman. -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="nama">Nama Lengkap</label>
        <!-- wadah relative: agar daftar rekomendasi menempel tepat di bawah kotak -->
        <div class="relative">
          <input id="nama" type="text" placeholder="cth: Andi" autocomplete="off" autofocus
                 class="input-glow w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500">
          <!-- daftar rekomendasi nama (muncul otomatis saat mengetik) -->
          <div id="saran" class="hidden absolute z-10 mt-1 w-full max-h-56 overflow-y-auto bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-2xl shadow-black/40"></div>
        </div>
        <!-- pesan kecil di bawah kotak (mis. "nama tidak ditemukan") -->
        <p id="pesan" class="hidden text-xs text-amber-400 mt-2"></p>
      </div>

      <!-- petunjuk untuk siswa -->
      <p class="text-slate-500 text-xs mt-4 text-center">Klik namamu pada daftar yang muncul, lalu masukkan PIN.</p>
    </div>

    <!-- catatan kaki -->
    <p class="text-center text-slate-500 text-xs mt-8">Lupa PIN? Hubungi gurumu ya 😊</p>
  </main>

  <script>
  // ============ FITUR REKOMENDASI NAMA (autocomplete) ============
  const inputNama = document.getElementById('nama');    // kotak isian nama
  const kotakSaran = document.getElementById('saran');  // wadah daftar rekomendasi
  const teksPesan = document.getElementById('pesan');   // teks pesan kecil di bawah kotak
  let tunda = null;                                     // penampung pewaktu (agar tidak memanggil server di setiap huruf)
  let daftarSiswa = [];                                 // hasil pencarian terakhir [{id, name}, ...]

  inputNama.addEventListener('input', () => {           // setiap kali siswa mengetik/hapus huruf
    clearTimeout(tunda);                                // batalkan rencana pencarian sebelumnya
    const q = inputNama.value.trim();                   // ambil teks, buang spasi di awal/akhir
    if (q.length < 1) {                                 // kalau kotak jadi kosong
      sembunyikanSaran();                               // tutup daftar rekomendasi
      return;                                           // berhenti, tidak perlu panggil server
    }
    tunda = setTimeout(() => cariSiswa(q), 250);        // tunggu 250 ms setelah berhenti mengetik, baru cari
  });

  async function cariSiswa(q) {                         // minta rekomendasi nama ke server
    try {
      // panggil route GET /auth/student/search?name=... (route asli aplikasi)
      const jawab = await fetch('/auth/student/search?name=' + encodeURIComponent(q));
      const data = await jawab.json();                  // ubah jawaban server ke list JavaScript
      daftarSiswa = data;                               // simpan hasilnya untuk dipakai saat diklik
      kotakSaran.innerHTML = '';                        // bersihkan rekomendasi lama
      if (daftarSiswa.length === 0) {                   // tidak ada nama yang cocok?
        teksPesan.textContent = 'Nama "' + q + '" tidak ditemukan. Coba ketik nama lengkapmu ya!'; // pesan ramah
        teksPesan.classList.remove('hidden');           // tampilkan pesan
        kotakSaran.classList.add('hidden');             // daftar disembunyikan
        return;                                         // berhenti
      }
      teksPesan.classList.add('hidden');                // sembunyikan pesan (karena ada hasil)
      daftarSiswa.forEach(s => {                        // buat satu tombol untuk tiap siswa yang ketemu
        const btn = document.createElement('button');   // buat elemen tombol baru
        btn.type = 'button';                            // tombol biasa (bukan kirim form)
        btn.className = 'saran-item block w-full text-left px-4 py-2.5 text-sm text-slate-200';
        const teks = document.createElement('span');    // wadah teks nama (aman dari kode jahat)
        teks.textContent = s.name;                      // pakai textContent, bukan innerHTML
        btn.appendChild(teks);                          // masukkan teks ke tombol
        btn.onclick = () => pilihNama(s.id);            // saat diklik: lanjut ke halaman PIN siswa itu
        kotakSaran.appendChild(btn);                    // tampilkan tombol di daftar
      });
      kotakSaran.classList.remove('hidden');            // tampilkan daftar rekomendasi
    } catch (err) {                                     // kalau server/jaringan bermasalah
      teksPesan.textContent = 'Gagal menghubungi server. Coba lagi sebentar.'; // beri tahu siswa
      teksPesan.classList.remove('hidden');             // tampilkan pesan error
    }
  }

  function pilihNama(id) {                              // siswa sudah mengklik namanya
    // pindah ke halaman PIN (langkah 2) sesuai alur asli aplikasi
    window.location.href = '/student/verify?student_id=' + id;
  }

  function sembunyikanSaran() {                         // menutup & mengosongkan daftar rekomendasi
    kotakSaran.classList.add('hidden');                 // sembunyikan daftar
    kotakSaran.innerHTML = '';                          // kosongkan isinya
    daftarSiswa = [];                                   // hapus hasil pencarian lama
  }

  inputNama.addEventListener('keydown', (e) => {        // trik keyboard: Enter & Escape
    if (e.key === 'Enter') {                            // Enter = pilih rekomendasi pertama
      e.preventDefault();                               // cegah perilaku bawaan browser
      const pertama = kotakSaran.querySelector('button'); // ambil tombol rekomendasi pertama
      if (pertama) pertama.click();                     // klik-kan otomatis
    }
    if (e.key === 'Escape') {                           // Esc = tutup daftar
      sembunyikanSaran();
    }
  });

  document.addEventListener('click', (e) => {           // klik di luar kotak nama
    if (e.target !== inputNama && !kotakSaran.contains(e.target)) {
      kotakSaran.classList.add('hidden');               // tutup daftar rekomendasi
    }
  });
  </script>
</body>
</html>
