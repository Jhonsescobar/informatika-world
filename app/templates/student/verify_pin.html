<!-- app/templates/student/verify_pin.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi PIN - INFORMATIKA WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-lg shadow-lg w-96 text-center">
        <h1 class="text-xl font-bold text-cyan-400 mb-4">Keamanan Verifikasi</h1>
        <p class="mb-6 text-sm">Masukkan PIN 4 digit Anda:</p>
        <form action="/auth/student/verify" method="POST">
            <input type="hidden" name="student_id" value="{{ student_id }}">
            <input type="password" name="pin" maxlength="4" required class="w-full p-2 bg-slate-700 rounded border border-slate-600 text-center text-2xl tracking-widest outline-none mb-4" placeholder="••••">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded">Masuk</button>
        </form>
    </div>
</body>
</html>
