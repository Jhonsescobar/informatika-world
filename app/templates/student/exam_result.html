<!-- app/templates/student/exam_result.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Ujian - INFORMATIKA WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-lg shadow-lg w-96 text-center">
        <h1 class="text-2xl font-bold text-cyan-400 mb-2">✅ Ujian Selesai</h1>
        <p class="text-slate-400 mb-6">Skor Anda:</p>
        <div class="text-6xl font-bold text-indigo-400 mb-8">{{ session.score }}</div>
        
        <div class="text-left space-y-2 mb-6">
            {% for ans in answers %}
            <div class="{{ 'text-green-400' if ans.is_correct else 'text-red-400' }}">
                {{ '✅ Benar' if ans.is_correct else '❌ Salah' }}
            </div>
            {% endfor %}
        </div>
        
        <a href="/student/dashboard" class="block bg-slate-700 hover:bg-slate-600 p-3 rounded transition">Kembali ke Dashboard</a>
    </div>
</body>
</html>
