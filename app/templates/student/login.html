<!-- app/templates/student/login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa - INFORMATIKA WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-lg shadow-lg w-96 text-center">
        <h1 class="text-2xl font-bold text-cyan-400 mb-4">🌍 INFORMATIKA WORLD</h1>
        <p class="mb-6 text-sm">Masukkan 3 huruf pertama namamu:</p>
        <input type="text" id="nameSearch" class="w-full p-2 bg-slate-700 rounded border border-slate-600 mb-4 outline-none" placeholder="Ketik nama...">
        <div id="searchResults" class="text-left mb-4 space-y-2"></div>
    </div>
    <script>
        // JavaScript autocomplete dengan error handling
        const input = document.getElementById('nameSearch');
        const resultsDiv = document.getElementById('searchResults');
        
        input.addEventListener('keyup', async () => {
            const nameVal = input.value.trim();
            // Mengambil nilai dan menghapus spasi di awal/akhir
            
            if(nameVal.length >= 3) {
                resultsDiv.innerHTML = '<p class="text-slate-500 text-sm">Mencari...</p>';
                // Menampilkan teks loading saat menunggu server
                
                try {
                    const res = await fetch(`/auth/student/search?name=${nameVal}`);
                    // Mengirim permintaan ke API FastAPI
                    
                    if (!res.ok) throw new Error("Server error");
                    // Jika server merespons dengan error (bukan 200 OK)
                    
                    const data = await res.json();
                    // Mengubah respons menjadi JSON
                    
                    resultsDiv.innerHTML = '';
                    // Kosongkan daftar sebelum mengisi yang baru
                    
                    if (data.length === 0) {
                        resultsDiv.innerHTML = '<p class="text-red-400 text-sm">Nama tidak ditemukan.</p>';
                        // Jika array kosong, berarti tidak ada siswa yang cocok
                    }
                    
                    data.forEach(s => {
                        const btn = document.createElement('a');
                        btn.href = `/student/verify?student_id=${s.id}`;
                        btn.className = "block p-2 bg-slate-700 rounded hover:bg-indigo-600 transition";
                        btn.textContent = s.name;
                        resultsDiv.appendChild(btn);
                        // Membuat tombol untuk setiap nama yang ditemukan
                    });
                    
                } catch (err) {
                    resultsDiv.innerHTML = '<p class="text-red-400 text-sm">Gagal menghubungi server.</p>';
                    // Jika fetch gagal (internet mati, dll)
                }
                
            } else { 
                resultsDiv.innerHTML = ''; 
                // Jika huruf kurang dari 3, kosongkan hasil
            }
        });
    </script>
</body>
</html>
