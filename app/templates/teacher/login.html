<!-- app/templates/teacher/login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru - INFORMATIKA WORLD</title>
</head>
<body style="font-family: sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <!-- Container utama form login -->
    <div style="background-color: #1e293b; padding: 2rem; border-radius: 8px; width: 300px;">
        <h2>Login Guru</h2>
        <!-- Form mengirim data POST ke /auth/teacher/login -->
        <form action="/auth/teacher/login" method="POST">
            <div style="margin-bottom: 1rem;">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; box-sizing: border-box; color: black;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box; color: black;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background-color: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Masuk</button>
        </form>
    </div>
</body>
</html>
