<!-- app/templates/teacher/grades.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Nilai - INFORMATIKA WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    <nav class="bg-slate-800 p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold text-cyan-400">INFORMATIKA WORLD</h1>
        <div class="flex gap-4 text-sm">
            <a href="/teacher/exams" class="text-indigo-400 hover:underline">📝 Ujian</a>
            <span class="text-white font-bold">⚖️ Nilai & Bobot</span>
        </div>
    </nav>
    <div class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 border-b border-slate-700 pb-2">⚖️ Komponen Nilai & Bobot</h2>
        
        <div class="bg-slate-800 p-6 rounded-lg mb-8 shadow-md border border-slate-700">
            <h3 class="text-lg font-semibold text-indigo-400 mb-4">Tambah Komponen Nilai Baru</h3>
            <form action="/teacher/grades/components/create" method="POST" class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm mb-1">Nama (Misal: Formatif 1)</label>
                    <input type="text" name="name" required class="w-full p-2 bg-slate-700 rounded border border-slate-600 outline-none">
                </div>
                <div>
                    <label class="block text-sm mb-1">Kelas</label>
                    <select name="class_target" required class="p-2 bg-slate-700 rounded border border-slate-600">
                        <option value="VII">VII</option><option value="VIII">VIII</option><option value="IX">IX</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-1">Bobot (%)</label>
                    <input type="number" name="weight" min="1" max="100" required class="w-20 p-2 bg-slate-700 rounded border border-slate-600 outline-none">
                </div>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">Tambah</button>
            </form>
        </div>

        <div class="space-y-4 mb-8">
            {% for comp in components %}
            <div class="bg-slate-800 p-4 rounded-lg border-l-4 border-cyan-500 shadow flex justify-between">
                <div>
                    <h4 class="font-bold">{{ comp.name }}</h4>
                    <p class="text-sm text-slate-400">Kelas {{ comp.class_target }}</p>
                </div>
                <span class="text-lg font-bold text-cyan-400">{{ comp.weight }}%</span>
            </div>
            {% endfor %}
        </div>

        <h3 class="text-lg font-semibold text-indigo-400 mb-4">Lihat Rekap Nilai Akhir</h3>
        <div class="flex gap-4">
            <a href="/teacher/grades/class/VII" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-lg font-bold transition">Kelas VII</a>
            <a href="/teacher/grades/class/VIII" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-lg font-bold transition">Kelas VIII</a>
            <a href="/teacher/grades/class/IX" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-lg font-bold transition">Kelas IX</a>
        </div>
    </div>
</body>
</html>
